h+=sec('works',L('Development Works','विकास कार्य'),grid(D.works,function(o){return'<div class="card"><h3>🛠 '+esc(g(o,'title'))+'</h3><span class="st">'+esc(g(o,'status'))+'</span>'+row('Village','गांव',g(o,'village'))+row('Budget','बजट',money(o.budget))+'</div>'}));
var bal=(+D.g.received||0)-(+D.g.spent||0);
h+=sec('acc',L('Panchayat Accounts','पंचायत लेखा'),'<div class="acc"><div class="card"><b>'+money(D.g.received)+'</b>'+L('Received','प्राप्त')+'</div><div class="card"><b>'+money(D.g.spent)+'</b>'+L('Spent','खर्च')+'</div><div class="card"><b>'+money(bal)+'</b>'+L('Balance','शेष')+'</div></div><p class="row">'+L('As of ','दिनांक तक: ')+esc(D.g.asof||new Date().toLocaleDateString('en-IN'))+'</p>');
h+=sec('fb',L('Feedback','सुझाव / फीडबैक'),'<div class="card"><input id="fn" placeholder="'+L('Your name','आपका नाम')+'"><textarea id="fm" rows="4" placeholder="'+L('Your feedback','आपका सुझाव')+'"></textarea><button class="btn" onclick="sendFb()">'+L('Send','भेजें')+'</button></div>');
document.getElementById('mn').innerHTML=h;
document.getElementById('ft').innerHTML='© '+new Date().getFullYear()+' '+L('Gram Panchayat Kheri Radan','ग्राम पंचायत खेड़ी राड़ान')+' | kheriradan.com<br>'+L('Powered by','संचालित द्वारा')+' <b>Divine Abhishek Services Private Limited</b>'}
function go(id){document.getElementById(id).scrollIntoView({behavior:'smooth'})}
function setL(l){lang=l;try{localStorage.setItem('kr_lang',l)}catch(e){}render()}
function tg(){var r=document.documentElement,d=r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'}
function sendFb(){var m=document.getElementById('fm').value.trim();if(!m)return;if(!window.FB){alert('Please wait and try again');return}FB.addFb(document.getElementById('fn').value,m).then(function(){document.getElementById('fm').value='';alert(L('Thank you for your feedback!','आपके सुझाव के लिए धन्यवाद!'))}).catch(function(){alert('Error, try again')})}
function clock(){var n=new Date();document.getElementById('clk').textContent='📅 '+n.toLocaleDateString(lang=='hi'?'hi-IN':'en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'  ⏰ '+n.toLocaleTimeString('en-IN')}
setInterval(clock,1000);
/* ADMIN */
var cur='g';
function login(){var a=document.getElementById('adm');a.style.display='block';if(window.FB&&FB.user){admin();return}a.innerHTML='<div class="card" style="max-width:380px;margin:60px auto"><h2>Admin Login</h2><input id="le" type="email" placeholder="Email"><input id="lp" type="password" placeholder="Password"><button class="btn" onclick="doLogin()">Login</button> <button class="btn g" onclick="document.getElementById(\'adm\').style.display=\'none\'">Cancel</button><p id="lm" style="color:#b3261e"></p></div>'}
function doLogin(){if(!window.FB){alert('Loading, try again');return}FB.login(document.getElementById('le').value,document.getElementById('lp').value).then(function(){admin()}).catch(function(e){document.getElementById('lm').textContent='Login failed: '+e.code})}
var FBL=null;
function loadFb(){FB.listFb().then(function(a){FBL=a;admin()})}
function fbHtml(){if(!FBL)return'<p>Loading...</p>';if(!FBL.length)return'<p>No feedback yet.</p>';return FBL.map(function(f){return'<div class="card" style="margin:8px 0"><b>'+esc(f.name||'-')+'</b> <small>'+esc(f.time)+'</small><p>'+esc(f.msg)+'</p><button class="btn r" onclick="FB.delFb(\''+f.id+'\').then(loadFb)">Delete</button></div>'}).join('')}
function admin(){var a=document.getElementById('adm');var t='<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px"><h2>Admin Panel <small id="sv"></small></h2><div><button class="btn g" onclick="exp()">Export backup</button> <label class="btn g" style="color:#fff;font-size:16px;display:inline-block">Import<input type="file" accept=".json" style="display:none" onchange="imp(this)"></label> <button class="btn r" onclick="if(confirm(\'Reset ALL data?\')){D=window.D=DEF();save();admin();render()}">Reset</button> <button class="btn" onclick="document.getElementById(\'adm\').style.display=\'none\';render()">Close</button></div></div><div class="tabs"><button class="btn'+(cur=='g'?'':' g')+'" onclick="cur=\'g\';admin()">General</button>';
for(var k in COL)t+='<button class="btn'+(cur==k?'':' g')+'" onclick="cur=\''+k+'\';admin()">'+COL[k][0]+'</button>';t+='<button class="btn'+(cur=='fb'?'':' g')+'" onclick="cur=\'fb\';FBL=null;admin();loadFb()">Feedback</button><button class="btn r" onclick="FB.out()">Logout</button></div>';
if(cur=='fb')t+=fbHtml();else if(cur=='g')t+='<div class="card f2">'+form(GF,D.g,'g',-1)+'</div>';
else{var f=COL[cur][2];D[cur].forEach(function(o,i){t+='<details><summary>'+esc(o.name_en||o.title_en||('#'+i))+'</summary><div class="f2">'+form(f,o,cur,i)+'</div><button class="btn r" onclick="D[cur].splice('+i+',1);save(cur);admin()">Delete</button></details>'});t+='<button class="btn" onclick="addItem()">+ Add new</button>'}
a.innerHTML=t}
function inp(k,lab,v,c,i,x){var id="'"+c+"',"+i+",'"+k+"'";return'<div><label>'+lab+'</label>'+(x?'<textarea rows="3" oninput="upd('+id+',this.value)">'+esc(v)+'</textarea>':'<input value="'+esc(v)+'" oninput="upd('+id+',this.value)">')+'</div>'}
function form(F,o,c,i){return F.map(function(f){var k=f[0],ty=f[3];
if(ty=='b'||ty=='bx')return inp(k+'_en',f[1]+' (EN)',o[k+'_en'],c,i,ty=='bx')+inp(k+'_hi',f[2]+' (हिंदी)',o[k+'_hi'],c,i,ty=='bx');
if(ty=='i')return'<div><label>'+f[1]+' / '+f[2]+'</label>'+(o[k]?'<img src="'+o[k]+'" style="width:60px;height:60px;object-fit:cover;border-radius:50%;display:block">':'')+'<input type="file" accept="image/*" onchange="upl(this,\''+c+'\','+i+',\''+k+'\')"></div>';
if(ty=='s')return'<div><label>'+f[1]+'</label><select onchange="upd(\''+c+'\','+i+',\''+k+'\',this.value)">'+['photo','pdf','video'].map(function(x){return'<option'+(o[k]==x?' selected':'')+'>'+x+'</option>'}).join('')+'</select></div>';
return inp(k,f[1]+' / '+f[2],o[k],c,i)}).join('')}
function upd(c,i,k,v){(c=='g'?D.g:D[c][i])[k]=v;save(c)}
function upl(el,c,i,k){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,320/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*s;cv.height=im.height*s;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);upd(c,i,k,cv.toDataURL('image/jpeg',.7));admin()};im.src=r.result};r.readAsDataURL(f)}
function addItem(){var o={};COL[cur][2].forEach(function(f){if(f[3]=='b'||f[3]=='bx'){o[f[0]+'_en']='';o[f[0]+'_hi']=''}else o[f[0]]=''});if(cur=='events')o.type='pdf';D[cur].push(o);save(cur);admin()}
function exp(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='kheriradan-data.json';a.click()}
function imp(el){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{D=window.D=JSON.parse(r.result);save();admin();render()}catch(e){alert('Invalid file')}};r.readAsText(f)}
render();clock();
</script><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,getDocs,setDoc,addDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const app=initializeApp({apiKey:"AIzaSyA8H81G0JL5Zfe1g05ToModVu33sojU6WY",authDomain:"kheriradan.firebaseapp.com",projectId:"kheriradan",storageBucket:"kheriradan.firebasestorage.app",messagingSenderId:"890414752117",appId:"1:890414752117:web:e643d6aa86ae907558733c"});
const db=getFirestore(app),auth=getAuth(app);let empty=true;
const FB=window.FB={user:null,
save:l=>Promise.all(l.map(c=>setDoc(doc(db,'site',c),c=='g'?window.D.g:{items:window.D[c]}))),
login:async(e,p)=>{await signInWithEmailAndPassword(auth,e,p);if(empty){empty=false;await FB.save(Object.keys(window.D))}},
out:()=>signOut(auth).then(()=>{document.getElementById('adm').style.display='none'}),
addFb:(name,msg)=>addDoc(collection(db,'feedback'),{name:name.slice(0,100),msg:msg.slice(0,900),time:new Date().toISOString()}),
listFb:async()=>{const r=await getDocs(collection(db,'feedback'));return r.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.time>a.time?1:-1)},
delFb:id=>deleteDoc(doc(db,'feedback',id))};
onAuthStateChanged(auth,u=>{FB.user=u});
try{const r=await getDocs(collection(db,'site'));r.forEach(d=>{empty=false;if(d.id=='g')Object.assign(window.D.g,d.data());else if(d.data().items)window.D[d.id]=d.data().items});render()}catch(e){console.log(e)}
</script>
</body></html>
